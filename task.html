<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>משימה · דפדף</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<script>
/* האפליקציה כהה בכל מקום. מצב התצוגה ניתן לשינוי רק בתוך ספר
   פתוח, ולכן רק reader.html קורא את ההעדפה השמורה. */
document.documentElement.className = 'theme-dark';
</script>
</head>

<body>
<!-- עטיפה אחידה לכל משימת רוטציה (המפרט, סעיף 9.3) -->
<main class="screen screen--fixed screen--nav screen-in">
  <header class="screen__header">
    <button data-back-btn></button>
    <button data-menu-btn hidden></button>
    <h1 data-task-title></h1>
    <span class="chip" style="margin-inline-start:auto;" data-task-value></span>
  </header>

  <div class="screen__body stack" data-module></div>

  <footer data-task-actions></footer>
</main>

<script src="js/boot.js"></script>
<script type="module" src="js/ui/task.js"></script>
</body>
</html>
