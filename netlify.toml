[build]
  publish = "."
  command = ""

# אתר סטטי בלי build step (המפרט, סעיף 2)

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# no-store ולא must-revalidate: ספארי באייפון ממשיך להגיש JS ישן
# מהמטמון גם כשהשרת מבקש אימות מחדש, והמודולים מייבאים זה את זה
# בנתיבים פנימיים — כך שחותמת גרסה על קובץ הכניסה לא מנקה אותם.
# בדמו הרוחב-פס זניח, והוודאות שרואים את הגרסה האחרונה שווה יותר.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# הפוך מהכלל למעלה: הקבצים ב-vendor נעולים לגרסה מדויקת ולעולם
# אינם משתנים במקום — עדכון ספרייה מחליף נתיב. 42MB של MediaPipe
# ב-no-store היו הורדה מחדש בכל טעינה.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# פרוקסי לתוכן בן-יהודה.
#
# benyehuda.org אינו מחזיר CORS, ולכן הדפדפן אינו יכול למשוך ממנו
# ישירות — נמדד: "Failed to fetch". הקטלוג מחזיק מטא-דאטה בלבד
# (ספר ממוצע 700KB, ומאות ספרים לא נכנסים לאפליקציה), והטקסט נמשך
# דרך כאן בפתיחה ראשונה ונשמר במטמון.
#
# באנדרואיד אין מגבלת CORS ל-HTTP נייטיב, ושם עדיף למשוך ישירות
# במקום להיות תלויים באתר שלנו (changes-v5.md).
# מטופל ב-netlify/functions/by.js — פרוקסי פשוט לא מספיק, כי
# הכתובת מחזירה 302 אל blob חתום והדפדפן נשלח חזרה למקור שאין
# לו CORS. הפונקציה עוקבת בצד השרת.
