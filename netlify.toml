[build]
  publish = "."
  command = ""

# אתר סטטי בלי build step (המפרט, סעיף 2)

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# no-store ולא must-revalidate: ספארי באייפון ממשיך להגיש JS ישן
# מהמטמון גם כשהשרת מבקש אימות מחדש, והמודולים מייבאים זה את זה
# בנתיבים פנימיים — כך שחותמת גרסה על קובץ הכניסה לא מנקה אותם.
# בדמו הרוחב-פס זניח, והוודאות שרואים את הגרסה האחרונה שווה יותר.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# הפוך מהכלל למעלה: הקבצים ב-vendor נעולים לגרסה מדויקת ולעולם
# אינם משתנים במקום — עדכון ספרייה מחליף נתיב. 42MB של MediaPipe
# ב-no-store היו הורדה מחדש בכל טעינה.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
