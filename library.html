<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<title>ספרייה · דפדף</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<script>
(function () {
  var t;
  try { t = JSON.parse(localStorage.getItem('dafdef:settings') || '{}').theme; } catch (e) {}
  if (['light', 'dark', 'sepia'].indexOf(t) === -1) {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.className = 'theme-' + t;
})();
</script>
</head>

<body>
<main class="screen screen--nav screen-in">
  <header class="screen__header">
    <h1>ספרייה</h1>
  </header>

  <div class="screen__body stack-6">
    <!-- חיפוש + סינון לפי מחבר/סוגה — נבנה בשלב 3 -->
    <div data-library-search></div>
    <div data-library-filters></div>
    <section class="stack" data-library-list aria-label="יצירות"></section>
  </div>
</main>

<div data-navbar></div>

<script type="module">
  import { initTheme } from './js/ui/theme.js';
  import { renderNavbar } from './js/ui/nav.js';
  initTheme();
  renderNavbar('library');
</script>
</body>
</html>
