<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>קורא · דפדף</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<script>
(function () {
  var t;
  try { t = JSON.parse(localStorage.getItem('dafdef:settings') || '{}').theme; } catch (e) {}
  if (['light', 'dark'].indexOf(t) === -1) {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.className = 'theme-' + t;
})();
</script>
</head>

<body>
<main class="reader">

  <!-- פס עליון קבוע: מונה העמודים, ומולו חזרה והגדרות -->
  <div class="reader__strip">
    <span class="rchip" data-pages-today></span>
    <div class="reader__tools">
      <button class="toolbtn" data-home aria-label="חזרה לדף הבית"></button>
      <button class="toolbtn" data-swap-book aria-label="החלף ספר"></button>
      <button class="toolbtn" data-open-settings aria-label="הגדרות תצוגה"></button>
    </div>
  </div>

  <!-- אזור העמוד -->
  <div class="reader__stage" data-stage>
    <div class="reader__content" data-content></div>
    <div class="earned" data-earned></div>
  </div>

  <!-- פס תחתון קבוע: ניווט עמודים + מספר עמוד ואחוז -->
  <div class="reader__foot">
    <button class="pagebtn" data-turn="prev" aria-label="העמוד הקודם"></button>
    <div class="reader__pos">
      <span data-position></span>
      <span class="reader__pct" data-percent></span>
    </div>
    <button class="pagebtn" data-turn="next" aria-label="העמוד הבא"></button>
  </div>

  <!-- סרגל עליון — נפתח בהקשה במרכז -->
  <div class="reader__bars" data-bars>
    <div class="reader__bar reader__bar--top">
      <span class="reader__title" data-title></span>
      <button class="icon-btn" data-import aria-label="ייבוא קובץ EPUB"></button>
      <input type="file" accept=".epub,application/epub+zip" hidden data-file>
    </div>
  </div>

  <!-- גיליון הגדרות צף — נפתח מעל הטקסט ולא מחליף מסך -->
  <div class="sheet" data-sheet hidden>
    <div class="sheet__scrim" data-sheet-close></div>
    <div class="sheet__panel" role="dialog" aria-label="הגדרות תצוגה">
      <div class="sheet__grip" aria-hidden="true"></div>

      <div class="sheet__row">
        <span>גודל טקסט</span>
        <div class="reader__group">
          <button class="icon-btn" data-font="-" aria-label="הקטנת טקסט"></button>
          <span class="chip" data-font-size>17</span>
          <button class="icon-btn" data-font="+" aria-label="הגדלת טקסט"></button>
        </div>
      </div>

      <div class="sheet__row">
        <span>מצב תצוגה</span>
        <div class="seg" role="radiogroup" aria-label="מצב תצוגה">
          <button class="seg__item" data-mode="light" role="radio">בהיר</button>
          <button class="seg__item" data-mode="dark" role="radio">כהה</button>
        </div>
      </div>

      <hr class="divider">

      <button class="sheet__action" data-mark="start">
        <b>הספר מתחיל כאן</b>
        <small>מדלגים על תודות ופתח דבר — ההתקדמות תימדד מכאן</small>
      </button>

      <button class="sheet__action" data-mark="end">
        <b>זה סוף הספר</b>
        <small>מה שאחרי זה לא נספר, וסיום הספר ייחשב כאן</small>
      </button>

      <button class="btn btn--ghost btn--block" data-sheet-close>סגירה</button>
    </div>
  </div>

</main>

<script src="js/boot.js"></script>
<script type="module" src="js/ui/reader.js"></script>
</body>
</html>
