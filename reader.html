<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<title>קורא · דפדף</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<script>
(function () {
  var t;
  try { t = JSON.parse(localStorage.getItem('dafdef:settings') || '{}').theme; } catch (e) {}
  if (['light', 'dark', 'sepia'].indexOf(t) === -1) {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.className = 'theme-' + t;
})();
</script>
</head>

<body>
<!-- הקורא הוא מסך מלא בלי ניווט תחתון: העמוד תופס את כל השטח -->
<main class="screen screen-in">
  <!-- פס עליון דק: עמודים שנקראו היום + "+X דק' לעמוד" — שלב 2 -->
  <header data-reader-status></header>

  <!-- אזור העמוד (epub.js, תצוגת עמודים) — שלב 2 -->
  <div class="screen__body" data-reader-view></div>

  <!-- סרגלים בהקשה במרכז: שם היצירה/חזרה למעלה, גודל טקסט/מצב/מיקום למטה — שלב 2 -->
  <div data-reader-bars hidden></div>
</main>

<script type="module">
  import { initTheme } from './js/ui/theme.js';
  initTheme();
</script>
</body>
</html>
