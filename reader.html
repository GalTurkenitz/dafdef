<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<title>קורא · דפדף</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<script>
(function () {
  var t;
  try { t = JSON.parse(localStorage.getItem('dafdef:settings') || '{}').theme; } catch (e) {}
  if (['light', 'dark', 'sepia'].indexOf(t) === -1) {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.className = 'theme-' + t;
})();
</script>
</head>

<body>
<!-- הקורא הוא מסך מלא בלי ניווט תחתון: העמוד תופס את כל השטח -->
<main class="reader">

  <!-- פס עליון דק — תמיד גלוי (המפרט, סעיף 7.5) -->
  <div class="reader__strip">
    <span data-pages-today>0 עמודים היום</span>
    <span data-page-value>+15 דק׳ לעמוד</span>
  </div>

  <!-- אזור העמוד -->
  <div class="reader__stage" data-stage>
    <div class="reader__content" data-content></div>
    <div class="earned" data-earned></div>
  </div>

  <!-- סרגלים — נפתחים בהקשה במרכז -->
  <div class="reader__bars" data-bars>

    <div class="reader__bar reader__bar--top">
      <button class="icon-btn" data-back aria-label="חזרה"></button>
      <span class="reader__title" data-title></span>
      <button class="icon-btn" data-import aria-label="ייבוא קובץ EPUB"></button>
      <input type="file" accept=".epub,application/epub+zip" hidden data-file>
    </div>

    <div class="reader__bar reader__bar--bottom">
      <div class="row-between">
        <div class="reader__group">
          <button class="icon-btn" data-font="-" aria-label="הקטנת טקסט"></button>
          <span class="t-small" data-font-size>17</span>
          <button class="icon-btn" data-font="+" aria-label="הגדלת טקסט"></button>
        </div>
        <div class="reader__group">
          <button class="swatch swatch--light" data-mode="light" aria-label="בהיר"></button>
          <button class="swatch swatch--sepia" data-mode="sepia" aria-label="ספיה"></button>
          <button class="swatch swatch--dark"  data-mode="dark"  aria-label="כהה"></button>
        </div>
      </div>
      <div class="reader__pos" data-position></div>
    </div>

  </div>
</main>

<script type="module" src="js/ui/reader.js"></script>
</body>
</html>
