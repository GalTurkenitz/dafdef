<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="דפדף — זמן מסך לא מקבלים, מרוויחים.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>דפדף</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<!-- מחיל את מצב התצוגה לפני הציור הראשון כדי שלא תהיה הבזקה -->
<script>
(function () {
  var t;
  try { t = JSON.parse(localStorage.getItem('dafdef:settings') || '{}').theme; } catch (e) {}
  if (['light', 'dark'].indexOf(t) === -1) {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.className = 'theme-' + t;
})();
</script>
</head>

<body>
<!-- מסך אחד, בלי גלילה -->
<main class="screen screen--fixed screen--nav screen-in">

  <header class="topbar">
    <button data-menu-btn></button>
    <div data-streak-mount></div>
  </header>

  <!-- בנישה יחידה אין גלגל: כאן יושב עיגול הדקות, מעל המשימה -->
  <div data-solo-top></div>

  <!-- המשימה הבאה ושני הכפתורים — מתחת לרצף, בראש המסך -->
  <div data-next-task></div>

  <!-- גלגל הסבב — הנישות על ההיקף, הדקות במרכז -->
  <div class="screen__body home__wheel">
    <div data-wheel-mount></div>
  </div>

</main>

<div data-navbar></div>

<script src="js/boot.js"></script>
<script type="module" src="js/ui/home.js"></script>
</body>
</html>
