<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<meta name="description" content="דפדף — קרא כדי לפתוח. עמוד אחד שווה דקות מסך.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>דפדף</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<!-- מחיל את מצב התצוגה לפני הציור הראשון כדי שלא תהיה הבזקה -->
<script>
(function () {
  var t;
  try { t = JSON.parse(localStorage.getItem('dafdef:settings') || '{}').theme; } catch (e) {}
  if (['light', 'dark'].indexOf(t) === -1) {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.className = 'theme-' + t;
})();
</script>
</head>

<body>
<main class="screen screen--nav screen-in">

  <!-- יתרת הדקות + סטריק -->
  <header class="home__top">
    <div data-ring-mount></div>
    <div data-streak-mount></div>
  </header>

  <div class="screen__body stack-6">
    <!-- האפליקציות החסומות -->
    <section data-apps-grid aria-label="האפליקציות החסומות"></section>

    <!-- הספרים שבקריאה כרגע -->
    <section data-my-books aria-label="הספרים שלי"></section>
  </div>

</main>

<div data-navbar></div>

<script type="module" src="js/ui/home.js"></script>
</body>
</html>
