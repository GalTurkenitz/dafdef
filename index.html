<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="דפדף — זמן מסך לא מקבלים, מרוויחים.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>דפדף</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="/vendor/fonts/fonts.css">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<!-- מחיל את מצב התצוגה לפני הציור הראשון כדי שלא תהיה הבזקה -->
<script>
/* האפליקציה כהה בכל מקום. מצב התצוגה ניתן לשינוי רק בתוך ספר
   פתוח, ולכן רק reader.html קורא את ההעדפה השמורה. */
document.documentElement.className = 'theme-dark';
</script>
</head>

<body>
<!-- מסך אחד, בלי גלילה -->
<main class="screen screen--fixed screen--nav screen-in">

  <header class="topbar">
    <button data-menu-btn></button>
    <div data-streak-mount></div>
  </header>

  <!-- בנישה יחידה אין גלגל: כאן יושב עיגול הדקות, מעל המשימה -->
  <div data-solo-top></div>

  <!-- המשימה הבאה ושני הכפתורים — מתחת לרצף, בראש המסך -->
  <div data-next-task></div>

  <!-- גלגל הסבב — הנישות על ההיקף, הדקות במרכז -->
  <div class="screen__body home__wheel">
    <div data-wheel-mount></div>
  </div>

</main>

<div data-navbar></div>

<script src="js/boot.js"></script>
<script type="module" src="js/ui/home.js"></script>
</body>
</html>
