<!DOCTYPE html>
<html lang="he" dir="rtl" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<title>דשבורד · דפדף</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">

<script>
(function () {
  var t;
  try { t = JSON.parse(localStorage.getItem('dafdef:settings') || '{}').theme; } catch (e) {}
  if (['light', 'dark', 'sepia'].indexOf(t) === -1) {
    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.className = 'theme-' + t;
})();
</script>
</head>

<body>
<main class="screen screen--nav screen-in">
  <header class="screen__header">
    <h1>דשבורד</h1>
  </header>

  <div class="screen__body stack-6">
    <!-- טבעת יתרה גדולה (המפרט, סעיף 7.6) -->
    <div style="display: grid; place-items: center;" data-ring-mount></div>

    <!-- היום: עמודים / דקות שנצברו / דקות שנוצלו — שלב 7 -->
    <section data-today-stats></section>

    <!-- גרף עמודות 7 ימים (SVG, בלי ספריות) — שלב 7 -->
    <section data-week-chart></section>

    <!-- סטריק נוכחי ושיא · ספרים שהתחלת — שלב 7 -->
    <section data-streak-stats></section>
    <section data-books-progress></section>
  </div>
</main>

<div data-navbar></div>

<script type="module" src="js/ui/dashboard.js"></script>
</body>
</html>
